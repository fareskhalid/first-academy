name: Course system CI and deployment

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  application:
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    env:
      COMPOSE_PROJECT_NAME: course-ci
    steps:
      - uses: actions/checkout@v4
      - name: Install from clean checkout
        run: bash scripts/setup.sh
      - name: Formatting
        run: docker compose exec -T laravel.test vendor/bin/pint --test
      - name: PHP, Livewire, and MySQL concurrency tests
        run: bash scripts/test.sh
      - name: Mobile Chromium, WebKit, and desktop browser checks
        run: bash scripts/browser-test.sh
      - name: Service health
        run: docker compose exec -T laravel.test php artisan system:check
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: browser-results
          path: |
            playwright-report/
            test-results/
          retention-days: 7
      - name: Stop CI services
        if: always()
        run: docker compose -f compose.yaml -f compose.browser.yaml stop

  deploy:
    name: Deploy tested commit to Serv00
    needs: application
    if: github.ref == 'refs/heads/main' && (github.event_name == 'push' || github.event_name == 'workflow_dispatch')
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    environment:
      name: production
    concurrency:
      group: serv00-production
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v4
      - name: Deploy
        env:
          SERV00_HOST: ${{ vars.SERV00_HOST }}
          SERV00_USERNAME: ${{ vars.SERV00_USERNAME }}
          SERV00_DOMAIN: ${{ vars.SERV00_DOMAIN }}
          SERV00_SSH_PRIVATE_KEY: ${{ secrets.SERV00_SSH_PRIVATE_KEY }}
        run: bash scripts/serv00-github-deploy.sh
