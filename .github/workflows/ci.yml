name: Course system CI and deployment

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  application:
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    env:
      COMPOSE_PROJECT_NAME: course-ci
    steps:
      - uses: actions/checkout@v6
      - name: Cache dependency downloads
        uses: actions/cache@v6
        with:
          path: |
            ~/.cache/composer
            ~/.npm
          key: dependency-downloads-${{ runner.os }}-${{ hashFiles('composer.lock', 'package-lock.json') }}
          restore-keys: dependency-downloads-${{ runner.os }}-
      - uses: docker/setup-buildx-action@v4
      - name: Build cached application image
        uses: docker/build-push-action@v7
        with:
          context: docker/development
          load: true
          tags: course-system-dev:php8.5
          build-args: |
            WWWGROUP=1000
            NODE_VERSION=24
          cache-from: type=gha,scope=course-system-dev
          cache-to: type=gha,mode=max,scope=course-system-dev
      - name: Install from clean checkout
        env:
          SKIP_DOCKER_BUILD: 1
          SKIP_SYSTEM_CHECK: 1
        run: bash scripts/setup.sh
      - name: Formatting
        run: docker compose exec -T laravel.test vendor/bin/pint --test
      - name: PHP, Livewire, and MySQL concurrency tests
        run: bash scripts/test.sh
      - name: Mobile Chromium, WebKit, and desktop browser checks
        run: bash scripts/browser-test.sh
      - name: Service health
        run: docker compose exec -T laravel.test php artisan system:check
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: browser-results
          path: |
            playwright-report/
            test-results/
          retention-days: 7
      - name: Stop CI services
        if: always()
        run: docker compose -f compose.yaml -f compose.browser.yaml stop

  deploy:
    name: Deploy tested commit to Serv00
    needs: application
    if: github.ref == 'refs/heads/main' && (github.event_name == 'push' || github.event_name == 'workflow_dispatch')
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    environment:
      name: production
    concurrency:
      group: serv00-production
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v6
      - name: Deploy
        env:
          SERV00_HOST: ${{ vars.SERV00_HOST }}
          SERV00_USERNAME: ${{ vars.SERV00_USERNAME }}
          SERV00_DOMAIN: ${{ vars.SERV00_DOMAIN }}
          SERV00_SSH_PRIVATE_KEY: ${{ secrets.SERV00_SSH_PRIVATE_KEY }}
        run: bash scripts/serv00-github-deploy.sh
